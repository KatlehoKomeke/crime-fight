# Local Postgres matching production (Aurora PostgreSQL 17 + PostGIS).
services:
  db:
    # Multi-arch (amd64 + arm64) build by the postgis/docker-postgis maintainer;
    # the official postgis/postgis image is amd64-only.
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: civic
      POSTGRES_PASSWORD: civic
      POSTGRES_DB: civic
    ports:
      - "54329:5432"
    volumes:
      - civic-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic -d civic"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  civic-db:
